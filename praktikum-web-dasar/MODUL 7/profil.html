<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <title>Web Portofolio Ku</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        /* Container utama */
        .container {
            max-width: 960px;
            margin: auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Menu navigasi atas */
        nav {
            background-color: #222;
            color: white;
            display: flex;
            padding: 10px 20px;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            line-height: 30px;
            padding: 5px 10px;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #555;
        }

        /* Header gambar */
        .header-image {
            width: 100%;
            height: 200px;
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-position: center;
            background-size: cover;
            position: relative;
        }

        /* Bagian konten utama dengan sidebar dan isi */
        .content {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar kanan */
        .sidebar {
            width: 200px;
            background-color: #444;
            color: white;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Bagian utama isi */
        .main-content {
            flex: 1;
        }

        /* Box pendidikan */
        .education-boxes {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .edu-box {
            background-color: #ddd;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            cursor: default;
            user-select: none;
            border: 2px solid #bbb;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* Deskripsi cerita sekolah */
        .school-story {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        /* Footer copyright */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">

        <nav>
            <a href="#">HOME</a>
            <a href="#">PROFILE</a>
            <a href="#">CONTACT</a>
        </nav>

        <div class="header-image"></div>

        <div class="content">
            <div class="sidebar">
                <h3>TENTANG AKU</h3>
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor 
                    incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud 
                    exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
                </p>
            </div>

            <div class="main-content">
                <div class="education-boxes">
                    <div class="edu-box" title="SD">SD</div>
                    <div class="edu-box" title="SMP">SMP</div>
                    <div class
